# City source manifest, research-phase candidates (schema: spec/input-layers.md §5)
# Status: candidates only. Nothing downloaded or computed; coverage/sanity checks are pending (Step 3.4).
city: amsterdam
country: NL
languages: [nl, en]
boundary: {source: "Gemeente Amsterdam (gemeentegrens) or OSM admin boundary", id: null, note: "not resolved in this research pass"}
researched_at: 2026-10-09
researcher: "skill research phase v0 (agent)"
skill_version: 0.1.0
verification_legend:
  "true": "endpoint probed this session and responded with the expected content"
  "partial": "catalogue/metadata verified, but the data endpoint itself was not probed or did not respond"
  "false": "not verified; taken from search results or prior knowledge"

layers:

  I02_building_heights:
    best_candidate:
      tier: A
      source_name: "3DBAG (TU Delft 3D geoinformation group + 3DGI), LoD1.2/1.3/2.2 from BAG footprints + AHN"
      url: https://3dbag.nl
      access:
        method: api
        endpoint: https://api.3dbag.nl/collections/pand/items
        alt_endpoints:
          - https://data.3dbag.nl/latest/tile_index.fgb   # tiled CityJSON/GPKG/OBJ downloads; HEAD 200
        registration: false
      licence:
        id: CC-BY-4.0
        class: shareable
        attribution: "© 3DBAG by tudelft3d and 3DGI (CC BY 4.0)"
        evidence: "license link rel=license → creativecommons.org/licenses/by/4.0 in api.3dbag.nl/collections/pand"
      vintage: "rolling releases; BAG footprints updated per release, heights from latest AHN (AHN4, partly AHN5). Exact release tag not read this session"
      resolution: "per building (BAG pand), roof-height percentiles + ground height"
      coverage: null
      coverage_note: "expected ≈1.0 of BAG buildings in Amsterdam; not measured"
      derivation: "height = b3_h_dak_70p (or 50p) − b3_h_maaiveld per BAG pand; join to I01 on BAG identificatie"
      verified: true
      verification: "api.3dbag.nl/collections → 200 JSON, collection 'pand', CC BY 4.0 link; tile_index.fgb HEAD 200"
    considered:
      - source_name: "Kadaster 3D Basisvoorziening (3D Tiles gebouwen, LoD2.2; LoD1.3 where no AHN)"
        tier: A
        decision: alternate
        reason: "CC BY 4.0 national product (per data.overheid.nl dataset 75647); same BAG+AHN lineage as 3DBAG, but 3DBAG exposes per-building height attributes via a simpler API"
        url: https://api.pdok.nl/kadaster/3d-basisvoorziening/ogc/v1/collections
        verified: true   # OGC API collections endpoint returned 200
      - source_name: "AHN DSM/DTM 0.5 m (Rijkswaterstaat/Het Waterschapshuis) via PDOK WCS"
        tier: A
        decision: alternate
        reason: "ladder step 2 if self-deriving median(DSM−DTM) per footprint is preferred; CC0 per data.overheid.nl"
        url: https://service.pdok.nl/rws/ahn/wcs/v1_0?request=GetCapabilities&service=WCS
        verified: true   # GetCapabilities lists coverages dsm_05m, dtm_05m
      - {source_name: "EUBUCCO", tier: B, decision: rejected, reason: "superseded by tier A 3DBAG", verified: false}
      - {source_name: "GlobalBuildingAtlas heights", tier: B, decision: local-only, reason: "CC BY-NC", verified: false}
      - {source_name: "OSM building:levels × 3 m", tier: C, decision: rejected, reason: "superseded by tier A", verified: false}

