  I05_canopy_height:
    best_candidate:
      tier: A
      source_name: "AHN DSM/DTM 0.5 m via PDOK WCS → canopy height model"
      url: https://www.ahn.nl
      access: {method: wcs, endpoint: "https://service.pdok.nl/rws/ahn/wcs/v1_0?request=GetCapabilities&service=WCS", registration: false}
      licence:
        id: CC0-1.0
        class: shareable
        attribution: "AHN (Actueel Hoogtebestand Nederland)"
        evidence: "data.overheid.nl datasets 36461 (AHN DSM) and 47567 (AHN DTM): CC0 1.0"
      vintage: "AHN4 (flown 2020–2022) in the current mosaic; AHN5 (2023–2025) rollout status for Amsterdam not checked"
      resolution: "0.5 m"
      coverage: 1.0
      coverage_note: "national coverage; value assumed, not measured"
      derivation: "CHM = DSM − DTM, masked to vegetation (exclude 3DBAG/BGT pand footprints and water; optional NDVI > 0.3 from summer imagery). AHN4 point classes have no explicit vegetation class (vegetation sits in 'unclassified'), so masking is required"
      verified: true
      verification: "WCS GetCapabilities returned coverages dsm_05m, dtm_05m"
    considered:
      - {source_name: "Meta/WRI CHMv2 1 m", tier: B, decision: rejected, reason: "superseded by AHN tier A", verified: false}
      - {source_name: "Copernicus HRL Tree Cover Density", tier: B, decision: rejected, reason: "10 m; superseded", verified: false}

  I08_sealed_surface:
    best_candidate:
      tier: A
      source_name: "Basisregistratie Grootschalige Topografie (BGT) via PDOK OGC API Features"
      url: https://api.pdok.nl/lv/bgt/ogc/v1
      access:
        method: api
        endpoint: https://api.pdok.nl/lv/bgt/ogc/v1/collections?f=json
        alt_endpoints:
          - https://api.pdok.nl/lv/bgt/download/v1_0/dataset   # bulk download API, 200
        registration: false
      licence:
        id: CC0-1.0
        class: shareable
        attribution: "Basisregistratie Grootschalige Topografie (BGT), via PDOK"
        evidence: "data.overheid.nl has three BGT catalogue entries listing CC0 1.0, Public Domain Mark and CC BY 4.0; all are shareable. Confirm the canonical PDOK statement (expected CC0)"
      vintage: "live register"
      resolution: "1:500–1:2000 polygons; full planar partition of the city"
      coverage: 1.0
      coverage_note: "BGT is a complete planar partition; assumed, not measured"
      derivation: "sealed = wegdeel/ondersteunendwegdeel with fysiekVoorkomen in {gesloten verharding, open verharding, half verhard} + onbegroeidterreindeel (verhard types) + pand + overigbouwwerk. 'erf' (private yard) is ambiguous; split it with NDVI"
      verified: true
      verification: "collections list includes wegdeel, onbegroeidterreindeel, begroeidterreindeel, pand, waterdeel"
