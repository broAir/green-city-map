# City source manifest, research-phase candidates (schema: spec/input-layers.md §5)
# Status: candidates only. Nothing downloaded or computed; coverage/sanity checks are pending (Step 3.4).
city: warszawa
country: PL
languages: [pl]
boundary: {source: "PRG (GUGiK) powiat 1465 'Warszawa' (city with powiat rights) or OSM admin boundary", id: "TERYT 1465", note: "TERYT code used in GUGiK per-powiat downloads; gmina 146501_1"}
researched_at: 2026-10-10
researcher: "skill research phase v0 (agent)"
skill_version: 0.1.0
verification_legend:
  "true": "endpoint probed this session and responded with the expected content"
  "partial": "catalogue/metadata verified, but the data endpoint itself was not probed or did not respond"
  "false": "not verified; taken from search results or prior knowledge"
licence_context: >
  GUGiK national datasets: the geoportal 'Pobierz dane' identify popups for the 3D building models (LoD1 2024,
  LoD2 2017) and the 3D tree models (LoD1 2023) for powiat 1465 state 'Licencja CC BY 4.0' explicitly, and
  dane.gov.pl lists BDOT10k and NMPT as CC BY 4.0. The City of Warsaw publishes reuse terms in two places.
  (1) The old open-data portal api.um.warszawa.pl ('Warunki korzystania z danych') says its data are official
  materials not protected by copyright and may be used freely, with attribution 'Miasto Stołeczne Warszawa',
  the portal URL, and the data creation and acquisition dates.
  (2) The map portal mapa.um.warszawa.pl (CMS page 'Warunki ponownego wykorzystania informacji publicznej',
  served from /api/modul-mapowy/open/cms) covers WMS https://wms.um.warszawa.pl/serwis and
  WFS https://wfs.um.warszawa.pl/serwis + https://wms2.um.warszawa.pl/geoserver/wfs/wfs. Reuse is free for any
  purpose, with these conditions: name the source 'Urząd m.st. Warszawy'; give the data creation and acquisition
  dates and any author named; e-mail BG-informacjapubliczna@um.warszawa.pl about any processing; tell downstream
  users the data were modified; don't disrupt service. The county geodetic resource is excluded: EGiB, GESUT,
  BDOT500 and soil classes. Only parcel ids and geometry, and building ids, geometry and type, are fee-free.
  These are attribution-type public-sector terms with no NC clause, so city-resource layers are classed
  shareable (conditional). Confirm with a lawyer before the first upload, and send the processing e-mail once
  per dataset. EGiB attributes such as floor counts are local-only. The new city portal dane.um.warszawa.pl has
  23 datasets (CC BY 4.0 on dane.gov.pl, institution 7621), mostly transport and events, and none of the
  environmental layers below.

layers:

  I02_building_heights:
    best_candidate:
      tier: A
      source_name: "GUGiK Modele 3D budynków LoD1 2024 (CityGML 2.0, BDOT10k footprints, measuredHeight from LiDAR), powiat 1465 Warszawa"
      url: https://www.geoportal.gov.pl/pl/dane/inne-dane/modele-3d-budynkow/
      access:
        method: download
        endpoint: "https://opendata.geoportal.gov.pl/InneDane/Budynki3D/LOD1/2024/14/1465.zip"
        alt_endpoints:
          - "https://opendata.geoportal.gov.pl/InneDane/Budynki3D/LOD1/LOD1_2024.zip   # all of Poland"
        discovery: "WMS https://mapy.geoportal.gov.pl/wss/service/PZGIK/FOTO/WMS/ModeleBudynkow3D, layer Modele_3D_budynkow_LoD1_2024, GetFeatureInfo inside the powiat returns the link"
        registration: false
      licence:
        id: CC-BY-4.0
        class: shareable
        attribution: "Źródło: Główny Urząd Geodezji i Kartografii (GUGiK)"
        evidence: "GetFeatureInfo popup for powiat Warszawa (2024): 'Licencja CC BY 4.0' linking creativecommons.org/licenses/by/4.0/legalcode.pl; model page: 'dostępne bezpłatnie i możliwe do dowolnego wykorzystania'"
      vintage: "2024 (zip entries dated 2025-04-06)"
      resolution: "per building, LoD1 block with bldg:measuredHeight (m); EPSG:2180 + PL-EVRF2007-NH (EPSG:9651)"
      coverage: null
      coverage_note: "153,109 buildings in powiat 1465 per the popup, against 184,474 EGiB building records in the city WFS. EGiB includes small outbuildings, so the residential share is still to be measured"
      derivation: "measuredHeight per building; match to I01 by geometry. Use LoD2 2017 roof geometry (complement) for eaves/ridge where M01 needs facade height"
      verified: true
      verification: "HEAD 200, Content-Length 58,304,150. First 64 KB read: first entry 1465_N-34-126-d-d-3-2.gml; inflated text has bldg:lod1Solid and <bldg:measuredHeight uom=\"meter\">6.85</bldg:measuredHeight>. Popup read via GetFeatureInfo (EPSG:2180 bbox in central Warsaw)"
    complements:
      - source_name: "GUGiK Modele 3D budynków LoD2 2017 (CityGML 2.0, CAPAP), powiat 1465"
        tier: A
        url: https://www.geoportal.gov.pl/pl/dane/inne-dane/modele-3d-budynkow/
        access:
          method: download
          endpoint: "https://opendata.geoportal.gov.pl/InneDane/Budynki3D/LOD2/1465_gml.zip"
          alt_endpoints:
            - "https://integracja.gugik.gov.pl/Budynki3D/pobierz.php?plik=powiaty/1465_gml.zip   # rgugik URL pattern, 112,554,466 bytes"
          registration: false
        licence: {id: CC-BY-4.0, class: shareable, attribution: "Źródło: GUGiK", evidence: "GetFeatureInfo popup for Modele_3D_budynkow_LoD2_2017: 'Licencja CC BY 4.0'"}
        vintage: "state 2017 (zip entries dated 2018-11-14/16)"
        resolution: "LoD2 (bldg:lod2Solid, RoofSurface/WallSurface/GroundSurface, roofType); EPSG:2180 + PL-KRON86-NH heights"
        coverage_note: "139,279 buildings per popup; misses post-2017 construction. NO measuredHeight attribute: derive height as max(RoofSurface z) − min(GroundSurface z). Note the old Kronsztadt-86 vertical datum vs EVRF2007 in LoD1 2024"
        verified: true
        verification: "opendata URL HEAD 200, Content-Length 116,477,346. integracja URL HEAD 200 (112,554,466). The integracja server ignores Range, so one probe fetched the whole integracja zip by mistake; it was used only to list the central directory (136 entries Modele_3D/1465_N-34-*.gml, 2.67 GB uncompressed) and to read tag names from one sheet, then deleted"
    considered:
      - source_name: "GUGiK LoD1 via the rgugik URL pattern (integracja.gugik.gov.pl/Budynki3D/pobierz.php?plik=powiaty/lod1/1465_gml.zip)"
        tier: A
        decision: rejected
        reason: "HEAD 200, 49,976,959 bytes, but its first zip entry is dated 2019-07-19, so this URL serves LoD1 2019, not 2024. Use the opendata.geoportal.gov.pl 2024 URL above. The same probably applies to Kraków's lod1 alternate"
        url: "https://integracja.gugik.gov.pl/Budynki3D/pobierz.php?plik=powiaty/lod1/1465_gml.zip"
        verified: true
      - source_name: "m.st. Warszawa EGiB buildings WFS (wms2.um.warszawa.pl geoserver, layer wfs:budynki) with KONDYGNACJE_NADZIEMNE (floors above ground)"
        tier: B
        decision: local-only
        reason: "184,474 buildings (numberMatched), floors per building, EPSG:2178; ladder step 3 and a good check on LoD1 heights. But floor counts are EGiB attributes, and the city's reuse terms exclude EGiB beyond ids, geometry and type. Use for validation only"
        url: "https://wms2.um.warszawa.pl/geoserver/wfs/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=wfs:budynki&outputFormat=application/json"
        verified: true
      - source_name: "GUGiK NMT / NMPT (DTM/DSM) from national LiDAR"
        tier: A
        decision: alternate
        reason: "ladder step 2 (median(DSM−DTM)); CC BY 4.0 (dane.gov.pl). WCS GetCapabilities timed out (45 s) from the probe location again"
        url: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/NMPT/GRID1/WCS/DigitalSurfaceModelFormatTIFF"
        verified: false
      - {source_name: "EUBUCCO", tier: B, decision: rejected, reason: "superseded by tier A", verified: false}
      - {source_name: "GlobalBuildingAtlas heights", tier: B, decision: local-only, reason: "CC BY-NC", verified: false}

