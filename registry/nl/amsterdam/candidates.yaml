        verified: true   # returned GeoJSON FeatureCollection 'GELUID_2021'
      - source_name: "RIVM Geluid in Nederland van wegverkeer (Lden) 2022, 10 m raster"
        tier: A
        decision: complement
        reason: "Public Domain Mark; national, CNOSSOS, newer (2022) but road-only and Lden-only; useful to cross-check / fill road noise"
        url: https://data.rivm.nl/data/alo/rivm_20250101_Geluid_lden_wegverkeer_2022.zip
        verified: true   # HEAD 200, Last-Modified 2026-10-06
      - {source_name: "EEA END noise contours (Reportnet copy)", tier: A, decision: local-only, reason: "EEA terms restrict to research/non-profit; national CC0 original preferred", verified: false}

