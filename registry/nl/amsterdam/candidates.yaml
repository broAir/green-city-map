      access:
        method: download
        endpoint: https://haleconnect.com/services/bsp/org.1251.905c8b43-5525-409c-b693-0d5a378aeda8/service/atom/id_predefined_dataset
        alt_endpoints:
          - https://haleconnect.com/ows/services/org.1251.905c8b43-5525-409c-b693-0d5a378aeda8_wms?SERVICE=WMS&Request=GetCapabilities
        registration: false
      licence:
        id: CC0-1.0
        class: shareable
        attribution: "RIVM / gemeente Amsterdam (attribution courtesy, not required)"
        evidence: "data.overheid.nl CKAN license_id = creativecommons.org/publicdomain/zero/1.0"
      vintage: "2021 (reference year 2021; next END round due 2027 with ref. year 2026)"
      resolution: "noise contour polygons per source (road, rail, industry, aircraft) in 5 dB bands, Lden and Lnight; INSPIRE GML"
      coverage: null
      coverage_note: "agglomeration-wide; Amsterdam municipality expected fully covered; not measured"
      derivation: "facade level = band of contour polygon intersecting facade sample; per-source layers combined by energetic sum"
      verified: true
      verification: "ATOM feed 200, title 'Geluidbelastingkaart agglomeraties Lden en Lnight, 2021 (INSPIRE)'; CKAN metadata read. Dataset contents per municipality not inspected"
    considered:
