      tier: A
      source_name: "GUGiK Modele 3D budynków, LoD2 (CityGML 2.0, CAPAP project), powiat 1261 Kraków"
      url: https://www.geoportal.gov.pl/pl/dane/inne-dane/modele-3d-budynkow/
      access:
        method: download
        endpoint: "https://integracja.gugik.gov.pl/Budynki3D/pobierz.php?plik=powiaty/1261_gml.zip"
        registration: false
      licence:
        id: "PL-GUGiK-free (art. 40a Prawo geodezyjne; 'dowolne wykorzystanie')"
        class: shareable
        attribution: "Źródło: Główny Urząd Geodezji i Kartografii (GUGiK)"
        evidence: "geoportal.gov.pl model page: data free and 'możliwe do dowolnego wykorzystania'; no formal licence id on the page"
      vintage: "LoD2 state 2017–2018 (page says 2017, search snippet says 2018)"
      resolution: "per building, LoD2 roofs; LiDAR 4 or 12 pts/m²"
      coverage: null
      coverage_note: "58.8 MB zip of 1261_*.gml sheets returned for Kraków, so the city is inside LoD2 coverage; building share not measured. Newer buildings (post-2018) are missing; fill them from LoD1 2024"
      derivation: "measuredHeight or (max roof − ground) per CityGML building; match to I01 (BDOT10k BUBD_A / EGiB) by geometry"
      verified: true
      verification: "HTTP 200 application/octet-stream, Content-Length 58,754,313; zip central directory lists Modele_3D/1261_M-34-*.gml. URL pattern from the rgugik R package (models3D_download.R)"
    considered:
      - source_name: "GUGiK Modele 3D budynków LoD1 (2019/2021/2022/2024), national; 2024 has measuredHeight from LiDAR median"
        tier: A
        decision: alternate
        reason: "Newer footprints (BDOT10k 2024) with LiDAR median heights; preferred where LoD2 2017/18 is stale. The rgugik URL returned a 25.8 MB zip; which LoD1 year that URL serves is unconfirmed"
        url: "https://integracja.gugik.gov.pl/Budynki3D/pobierz.php?plik=powiaty/lod1/1261_gml.zip"
        verified: true
      - source_name: "GUGiK NMT / NMPT (DTM/DSM) 1 m or 0.5 m from national LiDAR (ISOK and later flights)"
        tier: A
        decision: alternate
        reason: "ladder step 2 (median(DSM−DTM)); NMPT listed CC BY 4.0 on dane.gov.pl (dataset 2028). WCS at mapy.geoportal.gov.pl timed out from the probe location"
        url: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/NMPT/GRID1/WCS/DigitalSurfaceModelFormatTIFF"
        verified: false
      - source_name: "Kraków MSIP 'Budynki ewidencyjne' (EGiB buildings) download service"
        tier: B
        decision: rejected
        reason: "Footprints only; the fields inspected (ident, numer, rodz_kst) carry no floor count. EGiB floor counts may exist in GUGiK's EGiB download; not checked"
        url: https://msip.um.krakow.pl/arcgis/rest/services/Pobieranie/Budynki/MapServer/0
        verified: true
      - {source_name: "EUBUCCO", tier: B, decision: rejected, reason: "superseded by tier A", verified: false}
      - {source_name: "GlobalBuildingAtlas heights", tier: B, decision: local-only, reason: "CC BY-NC", verified: false}

