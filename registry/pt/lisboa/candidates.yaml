# City source manifest, research-phase candidates (schema: spec/input-layers.md §5)
# Status: candidates only. Nothing downloaded or computed; coverage/sanity checks are pending (Step 3.4).
city: lisboa
country: PT
languages: [pt]
boundary: {source: "CML Base_LimiteConcelho (ArcGIS) or CAOP (DGT) or OSM admin boundary", id: null, note: "not resolved in this research pass"}
researched_at: 2026-10-09
researcher: "skill research phase v0 (agent)"
skill_version: 0.1.0
verification_legend:
  "true": "endpoint probed this session and responded with the expected content"
  "partial": "catalogue/metadata verified, but the data endpoint itself was not probed or did not respond"
  "false": "not verified; taken from search results or prior knowledge"
access_context: >
  dados.cm-lisboa.pt and geodados.cm-lisboa.pt sit behind a Cloudflare JS challenge (HTTP 403,
  cf-mitigated: challenge) for scripted clients. CML republishes many layers on ArcGIS Online
  (services.arcgis.com/1dSrzEWVQn5kHHyK), which is scriptable, and the national portal dados.gov.pt
  API mirrors CML metadata with licences.

layers:

  I02_building_heights:
    best_candidate:
      tier: A
      source_name: "DGT LiDAR 2024 (Portugal continental), MDS + MDT 50 cm → median(DSM − DTM) per footprint"
      url: https://cdd.dgterritorio.gov.pt
      access:
        method: download
        endpoint: "https://cdd.dgterritorio.gov.pt/dgt-fe/mapa?collection=LAZ"
        collections: [MDS-50cm, MDT-50cm, MDS-2m, MDT-2m, LAZ]
        registration: true
        registration_note: "free CDD account with e-mail confirmation; access immediate (GMT.jl DGT LiDAR tutorial)"
      licence:
        id: unknown
        class: local-only
        attribution: "Direção-Geral do Território (DGT), LiDAR 2024"
        evidence: "No licence text found for the 2024 LiDAR products. DGT's sibling products are CC BY on dados.gov.pt (COSc 2024/2025) and Azores LiDAR is CC BY, and SMOS says 'política de dados abertos'. Likely CC BY 4.0; confirm, then upgrade to shareable"
      vintage: "flown 2024"
      resolution: "0.5 m grids; point cloud ≈10 pts/m², LAS 1.4 PDRF 8, 9 thematic classes"
      coverage: 1.0
      coverage_note: "mainland Portugal; assumed, not measured"
      derivation: "median(MDS − MDT) per I01 footprint (CML 'Edificado' or OSM/Overture)"
      verified: partial
      verification: "dados.gov.pt lists DGT LiDAR collections pointing to the cdd.dgterritorio.gov.pt map; CDD login flow not exercised"
    considered:
      - source_name: "DGT Mapa de Construções LiDAR 2024 (SMOS, experimental)"
        tier: B
        decision: rejected
        reason: "Vector polygons of LiDAR class 6 'Construções'. The description gives no height attribute, and adjacent buildings < ~1 m apart are merged into one polygon, so DGT itself says not to use it for individual buildings. Licence 'notspecified'. Useful as an I01 completeness cross-check"
        url: https://geo2.dgterritorio.gov.pt/lidar/MConst_LiDAR2024_PTcont-gpkg.zip
        verified: true   # HEAD 200, 751 MB, Last-Modified 2026-09-16
      - source_name: "CML Edificado (Edificado_e_Vias layer 0)"
        tier: A
        decision: complement
        reason: "61,536 municipal footprints (COD_SIG, IDTIPO, NPRINCIP, MORADA); no height/floor fields. Use as I01 for the DSM−DTM derivation. Licence not checked"
        url: https://services.arcgis.com/1dSrzEWVQn5kHHyK/arcgis/rest/services/Edificado_e_Vias/FeatureServer/0
        verified: true
      - {source_name: "3D-GloBFP Europe (Che et al. 2024)", tier: B, decision: fallback, reason: "CC BY 4.0 (Zenodo concept 11391076); ML heights, RMSE 1.9–14.6 m", url: "https://doi.org/10.5281/zenodo.11391076", verified: true}
      - {source_name: "EUBUCCO", tier: B, decision: fallback, reason: "ODbL; if DGT licence stays unclear", verified: false}
      - {source_name: "GlobalBuildingAtlas heights", tier: B, decision: local-only, reason: "CC BY-NC", verified: false}
      - {source_name: "CML 3D city model (Lisboa 3D)", tier: A, decision: unverified, reason: "not found in CML ArcGIS Online services list or dados.gov.pt; may exist as a scene layer", verified: false}

