        evidence: "https://gtfs.openov.nl/LICENSE.TXT: 'These works are available under CC0 1.0 Universal'. DOVA concession appendix 'Datasets OV' v2.2.4 (2024) requires operators to publish via the NDOV Loketten as open data under CC-0"
      vintage: "Last-Modified 2026-10-10 03:52 GMT; feed_info validity 2026-10-10 to 2026-12-12 (feed_version gtransit_chb:1.0.3:9631); rebuilt daily"
      file_size_bytes: 257614787
      resolution: "stop-level; shapes included; calendar_dates.txt only (no calendar.txt)"
      coverage_note: "All Amsterdam urban modes in one feed: GVB tram 16 routes, metro 5, bus 44, ferry 10 (route_type 0/1/3/4); NS rail 110 + rail-replacement bus 106; Connexxion/EBS regional buses. No transfers.txt in this variant. No complements needed"
