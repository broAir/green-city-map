# City source manifest, research-phase candidates (schema: spec/input-layers.md §5)
# Status: candidates only. Nothing downloaded or computed; coverage/sanity checks are pending (Step 3.4).
city: krakow
country: PL
languages: [pl]
boundary: {source: "PRG (GUGiK) powiat 1261 'Kraków' (city with powiat rights) or OSM admin boundary", id: "TERYT 1261", note: "TERYT code used in GUGiK per-powiat downloads"}
researched_at: 2026-10-09
researcher: "skill research phase v0 (agent)"
skill_version: 0.1.0
verification_legend:
  "true": "endpoint probed this session and responded with the expected content"
  "partial": "catalogue/metadata verified, but the data endpoint itself was not probed or did not respond"
  "false": "not verified; taken from search results or prior knowledge"
licence_context: >
  GUGiK national datasets (BDOT10k, NMT, NMPT, 3D building models, orthophoto) have been free of
  charge since 31 July 2020 under the amended Geodetic and Cartographic Law (art. 40a). dane.gov.pl
  lists BDOT10k and NMPT as CC BY 4.0, and geoportal.gov.pl describes the 3D models as "możliwe do
  dowolnego wykorzystania". Kraków MSIP (msip.um.krakow.pl) layers carry no explicit licence
  (copyrightText empty, and no terms page found). Under the 2021 Polish open-data act, information
  published without conditions may arguably be reused unconditionally. That needs legal confirmation,
  so MSIP layers are classed local-only for now.

layers:

  I02_building_heights:
